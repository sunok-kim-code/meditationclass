<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>명상 클래스</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d1110;color:#f3f1ea;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
[hidden]{display:none!important}
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center bottom}
#shade{position:fixed;inset:0;background:linear-gradient(to bottom,rgba(13,17,16,.25),rgba(13,17,16,0) 22%,rgba(13,17,16,0) 55%,rgba(13,17,16,.7))}
#gl{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}

/* 로비 */
#lobby{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(13,17,16,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);overflow:auto}
.card{width:100%;max-width:380px;padding:22px;border-radius:22px;background:rgba(19,26,23,.88);border:1px solid rgba(255,255,255,.12)}
.card h1{margin:0 0 4px;font-size:24px;font-weight:600}
.card p.sub{margin:0 0 16px;font-size:13.5px;line-height:1.55;color:#c3cbc2}
.tabs{display:flex;gap:6px;padding:4px;border-radius:999px;background:rgba(255,255,255,.07);margin-bottom:16px}
.tabs button{flex:1;min-height:40px;border:0;border-radius:999px;background:transparent;font-size:14.5px}
.tabs button[aria-selected="true"]{background:#e9e2cf;color:#17201b;font-weight:600}
label.f{display:block;font-size:12.5px;color:#b9c2b8;margin:12px 2px 6px}
input.t{width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);font-size:16px}
input.code{letter-spacing:.3em;text-transform:uppercase;font-weight:600}
.primary{width:100%;min-height:52px;margin-top:18px;border:0;border-radius:999px;background:#e9e2cf;color:#17201b;font-size:16px;font-weight:600}
.primary:disabled{opacity:.6}
.note{margin:12px 2px 0;font-size:12px;line-height:1.5;color:#aab3a9}
.err{margin:12px 2px 0;font-size:13px;line-height:1.5;color:#ffb4a8}

/* 수업방 */
#room{position:fixed;inset:0;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom))}
#top{display:flex;align-items:center;gap:8px;min-height:36px}
.pill{padding:7px 12px;border-radius:999px;background:rgba(13,17,16,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:12.5px;line-height:1.3;white-space:nowrap}
#status{white-space:normal;margin-left:auto;text-align:right;max-width:58%}
#status.bad{background:rgba(120,30,24,.85)}
#hostSlot{flex:2.1;min-height:0;position:relative}
#grid{flex:1;min-height:0;display:grid;gap:4px;grid-auto-rows:1fr}
.slot{position:relative;min-width:0;min-height:0}
.slot .nm{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);max-width:96%;padding:3px 9px;border-radius:999px;background:rgba(13,17,16,.6);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hostSlot .nm{font-size:13px;padding:5px 12px}
.slot .ld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;color:#d6dbd3}
#empty{align-self:center;justify-self:center;text-align:center;font-size:13px;line-height:1.6;color:#e6e9e2;padding:10px 14px;border-radius:14px;background:rgba(13,17,16,.5)}
#bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding-top:8px}
.btn{min-height:44px;padding:0 15px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(13,17,16,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:14px}
.btn[aria-pressed="true"]{background:#e9e2cf;color:#17201b;border-color:#e9e2cf;font-weight:600}
.btn.danger{border-color:rgba(255,160,146,.6);color:#ffc9bf}
#sheet{position:fixed;left:0;right:0;bottom:0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0;background:rgba(19,26,23,.96);border-top:1px solid rgba(255,255,255,.14)}
#sheet h2{margin:0 0 10px;font-size:15px;font-weight:600}
.row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:44px;padding:0 15px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.07);font-size:14px}
.chip[aria-pressed="true"]{background:#e9e2cf;color:#17201b;border-color:#e9e2cf;font-weight:600}
.thumb{flex:0 0 auto;width:60px;height:60px;border-radius:12px;border:2px solid transparent;background-size:cover;background-position:center;padding:0}
.thumb[aria-pressed="true"]{border-color:#e9e2cf}
.thumb.av{width:72px;height:84px;background-color:rgba(255,255,255,.08);background-size:contain;background-repeat:no-repeat}
#over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:rgba(13,17,16,.8)}
#over p{margin:0;max-width:30ch;font-size:15px;line-height:1.6}
#over button{min-height:48px;padding:0 24px;border:0;border-radius:999px;background:#e9e2cf;color:#17201b;font-weight:600}
#unmute{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);min-height:52px;padding:0 24px;border:0;border-radius:999px;background:#e9e2cf;color:#17201b;font-size:16px;font-weight:600}
</style>
<script type="importmap">
{"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
}}
</script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<img id="bg" alt="">
<div id="shade"></div>
<canvas id="gl"></canvas>
<video id="cam" muted playsinline hidden></video>
<audio id="hostAudio" autoplay playsinline></audio>

<div id="room" hidden>
  <div id="top">
    <span class="pill" id="codePill"></span>
    <span class="pill" id="countPill"></span>
    <span class="pill" id="status" role="status"></span>
  </div>
  <div id="hostSlot" class="slot"></div>
  <div id="grid"></div>
  <div id="bar"></div>
</div>

<div id="sheet" hidden></div>
<button id="unmute" type="button" hidden>소리 켜기</button>

<div id="lobby">
  <div class="card">
    <h1>명상 클래스</h1>
    <p class="sub">진행자의 목소리를 들으며 아바타로 함께 앉습니다. 카메라 영상은 전송되지 않고, 표정과 고개 움직임 수치만 오갑니다.</p>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tabJoin" aria-selected="true">참가하기</button>
      <button type="button" role="tab" id="tabHost" aria-selected="false">수업 열기</button>
    </div>
    <label class="f" for="name">이름</label>
    <input class="t" id="name" maxlength="12" autocomplete="nickname" placeholder="수업에서 보일 이름">
    <label class="f" id="avLabel">캐릭터</label>
    <div class="row" id="lobbyAv" role="group" aria-labelledby="avLabel"></div>
    <div id="codeWrap">
      <label class="f" for="code">수업 코드</label>
      <input class="t code" id="code" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="ABC123">
    </div>
    <button class="primary" id="enter" type="button">참가하기</button>
    <p class="note" id="lobbyNote">입장할 때 카메라 사용을 묻습니다. 허용하지 않아도 참가할 수 있고, 그 경우 아바타는 가만히 앉아 있습니다.</p>
    <p class="err" id="lobbyErr" role="alert" hidden></p>
  </div>
</div>

<div id="over" hidden><p id="overMsg"></p><button type="button" id="overBtn">처음으로</button></div>

<script type="module">
import * as THREE from 'three';

const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const FACE_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
// neck: 목 위치(이미지 위에서부터의 비율). 이 위쪽이 고개 움직임을 따라간다.
const AVATARS = [
  { id: 'track', label: '트레이닝복', neck: 0.260 },
  { id: 'home', label: '홈웨어', neck: 0.299 },
  { id: 'yoga', label: '요가복', neck: 0.283 },
  { id: 'hanbok', label: '생활한복', neck: 0.266 },
  { id: 'knit', label: '니트', neck: 0.285 },
  { id: 'hoodie', label: '후드티', neck: 0.262 },
  { id: 'bear', label: '곰', neck: 0.318 },
  { id: 'cat', label: '고양이', neck: 0.366 },
];
const BGS = [{ id: 'center', label: '명상 센터' }, { id: 'temple', label: '산사' }, { id: 'bamboo', label: '대나무 숲' }, { id: 'beach', label: '바닷가' }, { id: 'mountain', label: '산' }, { id: 'night', label: '밤하늘' }];
const bgUrl = (id, thumb) => `bg/${thumb ? 'thumb-' : ''}${id}.jpg`;
const KEYS = ['eyeBlinkLeft', 'eyeBlinkRight', 'jawOpen', 'mouthFunnel', 'mouthPucker', 'mouthSmileLeft', 'mouthSmileRight'];
const MAX_GUESTS = 12, SEND_MS = 85, PREFIX = 'sunmedclass-';
const $ = (s) => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

/* ---------- 그리기 ---------- */
const canvas = $('#gl');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setScissorTest(true);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(24, 1, 0.05, 30);
const texLoader = new THREE.TextureLoader();
const texCache = new Map();
const loadTex = (url) => {
  if (!texCache.has(url)) texCache.set(url, texLoader.loadAsync(url).then((t) => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; }));
  return texCache.get(url);
};
const shadowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), r = g.createRadialGradient(64, 64, 4, 64, 64, 64);
  r.addColorStop(0, 'rgba(0,0,0,.45)'); r.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = r; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
})();
const VERT = `
uniform vec3 uRot; uniform float uNeck; uniform float uBreath; uniform float uW;
varying vec2 vUv;
void main() {
  vUv = uv;
  vec2 p = position.xy;
  float torso = smoothstep(-0.32, 0.05, p.y);
  p.y += uBreath * torso * 0.006;
  p.x *= 1.0 + uBreath * torso * 0.004;
  float w = smoothstep(uNeck - 0.035, uNeck + 0.05, position.y);
  vec2 q = p - vec2(0.0, uNeck);
  float c = cos(uRot.z * w), s = sin(uRot.z * w);
  q = vec2(c * q.x - s * q.y, s * q.x + c * q.y);
  q.x = q.x * (1.0 - 0.10 * abs(uRot.y) * w) + uRot.y * 0.085 * uW * w;
  q.y = q.y * (1.0 - 0.16 * uRot.x * w) - uRot.x * 0.012 * w;
  p = q + vec2(0.0, uNeck);
  gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 0.0, 1.0);
}`;
const FRAG = `
uniform sampler2D tOpen; uniform sampler2D tClosed; uniform float uBlink;
varying vec2 vUv;
void main() {
  vec4 a = texture2D(tOpen, vUv), b = texture2D(tClosed, vUv);
  gl_FragColor = mix(a, b, uBlink);
  if (gl_FragColor.a < 0.01) discard;
  #include <colorspace_fragment>
}`;

// 앉은 자세로 그려진 2D 캐릭터. 목 위쪽을 고개 움직임에 맞춰 휘고, 눈 뜬/감은 그림을 섞는다.
async function makeAvatar(defId) {
  const def = AVATARS.find((a) => a.id === defId) || AVATARS[0];
  const [tOpen, tClosed] = await Promise.all([loadTex(`avatars/${def.id}-open.webp`), loadTex(`avatars/${def.id}-closed.webp`)]);
  const W = tOpen.image.width / tOpen.image.height, neck = 0.5 - def.neck;
  const mat = new THREE.ShaderMaterial({ vertexShader: VERT, fragmentShader: FRAG, transparent: true, depthTest: false,
    uniforms: { tOpen: { value: tOpen }, tClosed: { value: tClosed }, uBlink: { value: 0 }, uRot: { value: new THREE.Vector3() }, uNeck: { value: neck }, uBreath: { value: 0 }, uW: { value: W } } });
  const body = new THREE.Mesh(new THREE.PlaneGeometry(W, 1, 24, 48), mat);
  body.renderOrder = 1;
  const sh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthTest: false }));
  sh.position.set(0, -0.47, 0); sh.scale.set(W * 1.15, 0.12, 1);
  const root = new THREE.Group(); root.add(sh, body); root.visible = false;
  let blink = 0;
  return {
    defId: def.id, root, center: new THREE.Vector3(0, 0, 0), halfH: 0.52, halfW: W / 2 + 0.02,
    update(p, dt, t) {
      mat.uniforms.uRot.value.set(p.euler.x, p.euler.y, p.euler.z);
      mat.uniforms.uBreath.value = Math.sin(t * 0.9 + p.phase);
      const b = Math.max(p.blend.eyeBlinkLeft || 0, p.blend.eyeBlinkRight || 0);
      blink = THREE.MathUtils.clamp((b - 0.25) / 0.35, 0, 1);
      mat.uniforms.uBlink.value = blink;
    },
    dispose() { scene.remove(root); body.geometry.dispose(); mat.dispose(); sh.geometry.dispose(); sh.material.dispose(); },
  };
}

/* ---------- 상태 ---------- */
const S = { role: null, code: '', myId: null, name: '', avatar: AVATARS[Math.floor(Math.random() * AVATARS.length)].id, bg: BGS[0].id, peer: null, hostConn: null, conns: new Map(), calls: new Map(), mic: null, micOn: true, bowl: false, camOn: false, ended: false };
const members = new Map(); // id -> { id, name, avatar, host, slot, inst, token, pose, target, lastSeen }
const statusEl = $('#status');
const say = (t, bad) => { statusEl.textContent = t; statusEl.classList.toggle('bad', !!bad); };

function newPose() { return { blend: {}, quat: new THREE.Quaternion(), euler: new THREE.Euler(), phase: Math.random() * 6 }; }
function addMember(m) {
  if (members.has(m.id)) return members.get(m.id);
  const mem = { id: m.id, name: m.name, avatar: m.avatar, host: !!m.host, slot: null, inst: null, token: 0, pose: newPose(), target: { blend: {}, quat: new THREE.Quaternion() }, lastSeen: 0 };
  members.set(mem.id, mem);
  loadInst(mem);
  layout();
  return mem;
}
function removeMember(id) {
  const mem = members.get(id); if (!mem) return;
  mem.token++; if (mem.inst) mem.inst.dispose();
  members.delete(id);
  layout();
}
async function loadInst(mem) {
  const token = ++mem.token, want = mem.avatar;
  try {
    const inst = await makeAvatar(want);
    if (mem.token !== token || !members.has(mem.id)) { inst.dispose(); return; }
    if (mem.inst) mem.inst.dispose();
    mem.inst = inst; scene.add(inst.root);
    if (mem.slot) mem.slot.querySelector('.ld')?.remove();
  } catch (err) {
    console.error(err);
    if (mem.slot && mem.token === token) { const l = mem.slot.querySelector('.ld'); if (l) l.textContent = '아바타를 불러오지 못했습니다'; }
  }
}
function setAvatar(id, avatar) { const mem = members.get(id); if (!mem || mem.avatar === avatar) return; mem.avatar = avatar; if (mem.slot && !mem.slot.querySelector('.ld')) mem.slot.append(el('div', 'ld', '바꾸는 중…')); loadInst(mem).then(() => mem.slot?.querySelector('.ld')?.remove()); }

function layout() {
  const hostSlot = $('#hostSlot'), grid = $('#grid');
  const host = [...members.values()].find((m) => m.host);
  const guests = [...members.values()].filter((m) => !m.host);
  const fill = (slot, mem, label) => {
    slot.replaceChildren();
    if (!mem.inst) slot.append(el('div', 'ld', '아바타 불러오는 중…'));
    slot.append(el('div', 'nm', label));
    mem.slot = slot;
  };
  if (host) fill(hostSlot, host, `진행자 · ${host.name}${host.id === S.myId ? ' (나)' : ''}`); else hostSlot.replaceChildren();
  grid.replaceChildren();
  const n = guests.length, cols = n <= 3 ? Math.max(n, 1) : n <= 8 ? 4 : 5;
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  if (!n) grid.append(Object.assign(el('div', null, S.role === 'host' ? '아직 참가자가 없습니다.\n코드나 초대 링크를 보내 주세요.' : ''), { id: 'empty', style: 'white-space:pre-line' + (S.role === 'host' ? '' : ';display:none') }));
  guests.sort((a, b) => (a.id === S.myId ? -1 : b.id === S.myId ? 1 : 0));
  for (const g of guests) { const slot = el('div', 'slot'); fill(slot, g, g.id === S.myId ? `${g.name} (나)` : g.name); grid.append(slot); }
  $('#countPill').textContent = `${members.size}명`;
}

/* ---------- 표정 데이터 ---------- */
const enc = (blend, e) => [[+e.x.toFixed(3), +e.y.toFixed(3), +e.z.toFixed(3)], KEYS.map((k) => Math.round((blend[k] || 0) * 100))];
function applyPacket(mem, pk, mirror) {
  const [e, b] = pk, blend = {};
  KEYS.forEach((k, i) => { blend[k] = (b[i] || 0) / 100; });
  if (mirror) {
    for (const k of KEYS) if (k.endsWith('Left')) { const r = k.replace(/Left$/, 'Right'), t = blend[k]; blend[k] = blend[r]; blend[r] = t; }
    mem.target.quat.setFromEuler(new THREE.Euler(e[0], -e[1], -e[2]));
  } else mem.target.quat.setFromEuler(new THREE.Euler(e[0], e[1], e[2]));
  mem.target.blend = blend; mem.lastSeen = performance.now();
}

/* ---------- 얼굴 추적 ---------- */
const cam = $('#cam');
let landmarker = null, lastVT = -1, myPacket = null, myPacketAt = 0;
const m4 = new THREE.Matrix4(), tmpE = new THREE.Euler();
async function startCamera() {
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('nocam');
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
    cam.srcObject = stream; await cam.play();
    S.camOn = true;
    if (!landmarker) {
      const { FaceLandmarker, FilesetResolver } = await import(`${MP}/vision_bundle.mjs`);
      const files = await FilesetResolver.forVisionTasks(`${MP}/wasm`);
      const opt = (d) => ({ baseOptions: { modelAssetPath: FACE_MODEL, delegate: d }, runningMode: 'VIDEO', numFaces: 1, outputFaceBlendshapes: true, outputFacialTransformationMatrixes: true });
      try { landmarker = await FaceLandmarker.createFromOptions(files, opt('GPU')); }
      catch (e) { console.warn('GPU 실패, CPU로 전환', e); landmarker = await FaceLandmarker.createFromOptions(files, opt('CPU')); }
    }
    return true;
  } catch (err) { console.warn(err); S.camOn = false; return false; }
}
function stopCamera() { cam.srcObject?.getTracks().forEach((t) => t.stop()); cam.srcObject = null; S.camOn = false; myPacket = null; }
function track(now) {
  if (!S.camOn || !landmarker || cam.readyState < 2 || cam.currentTime === lastVT) return;
  lastVT = cam.currentTime;
  let r; try { r = landmarker.detectForVideo(cam, now); } catch (e) { return; }
  if (!r.faceBlendshapes?.length) return;
  const blend = {};
  for (const c of r.faceBlendshapes[0].categories) blend[c.categoryName] = c.score;
  const mat = r.facialTransformationMatrixes?.[0];
  if (mat) { m4.fromArray(mat.data); tmpE.setFromRotationMatrix(m4); const L = 0.6, c = THREE.MathUtils.clamp; tmpE.set(c(tmpE.x, -L, L), c(tmpE.y, -L, L), c(tmpE.z, -L, L)); } else tmpE.set(0, 0, 0);
  setMyPacket(enc(blend, tmpE));
}
function setMyPacket(pk) { myPacket = pk; myPacketAt = performance.now(); const me = members.get(S.myId); if (me) applyPacket(me, pk, true); }

/* ---------- 연결 ---------- */
const hostPeerId = (code) => PREFIX + code.toLowerCase() + '-host';
const newCode = () => Array.from({ length: 6 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 32)]).join('');
const roster = () => [...members.values()].map((m) => ({ id: m.id, name: m.name, avatar: m.avatar, host: m.host }));
const cast = (msg, except) => { for (const [id, c] of S.conns) if (id !== except && c.open) c.send(msg); };
const micConstraints = () => ({ audio: S.bowl ? { echoCancellation: false, noiseSuppression: false, autoGainControl: false } : { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: false });

function openHost(tries = 0) {
  return new Promise((resolve, reject) => {
    const code = newCode(), peer = new Peer(hostPeerId(code));
    peer.on('open', (id) => { if (S.peer === peer) { hostStatus(); return; } S.peer = peer; S.code = code; S.myId = id; resolve(); });
    peer.on('error', (err) => {
      if (S.peer === peer) { if (err.type === 'network' || err.type === 'disconnected') say('연결 서버에 다시 붙는 중… 수업은 계속됩니다'); return; }
      peer.destroy();
      if (err.type === 'unavailable-id' && tries < 3) openHost(tries + 1).then(resolve, reject); else reject(err);
    });
    peer.on('disconnected', () => { if (!S.ended) peer.reconnect(); });
    peer.on('connection', (conn) => {
      conn.on('data', (msg) => onHostData(conn, msg));
      conn.on('close', () => { if (!S.conns.has(conn.peer)) return; S.conns.delete(conn.peer); S.calls.get(conn.peer)?.close(); S.calls.delete(conn.peer); removeMember(conn.peer); cast({ t: 'leave', id: conn.peer }); });
    });
  });
}
function onHostData(conn, msg) {
  if (!msg || typeof msg !== 'object') return;
  const id = conn.peer;
  if (msg.t === 'hello') {
    if (S.conns.size >= MAX_GUESTS) { conn.send({ t: 'full' }); setTimeout(() => conn.close(), 300); return; }
    const m = { id, name: String(msg.name || '참가자').slice(0, 12), avatar: AVATARS.some((a) => a.id === msg.avatar) ? msg.avatar : AVATARS[0].id, host: false };
    S.conns.set(id, conn); addMember(m);
    conn.send({ t: 'room', you: id, bg: S.bg, members: roster() });
    cast({ t: 'join', m }, id);
    if (S.mic) S.calls.set(id, S.peer.call(id, S.mic));
  } else if (!S.conns.has(id)) return;
  else if (msg.t === 'p' && Array.isArray(msg.k)) { const mem = members.get(id); if (mem) { applyPacket(mem, msg.k, false); mem.raw = msg.k; } }
  else if (msg.t === 'avatar' && AVATARS.some((a) => a.id === msg.avatar)) { setAvatar(id, msg.avatar); cast({ t: 'avatar', id, avatar: msg.avatar }); }
}
function joinRoom(code) {
  return new Promise((resolve, reject) => {
    const peer = new Peer(); let done = false;
    const fail = (m) => { if (done) return; done = true; peer.destroy(); reject(new Error(m)); };
    const timer = setTimeout(() => fail('연결 시간이 초과됐습니다. 네트워크를 확인하고 다시 시도해 주세요.'), 20000);
    peer.on('error', (err) => {
      if (done) { if (!S.ended && (err.type === 'network' || err.type === 'disconnected')) say('연결 서버에 다시 붙는 중… 수업은 계속됩니다'); return; }
      clearTimeout(timer);
      fail(err.type === 'peer-unavailable' ? '수업을 찾지 못했습니다. 코드를 확인하거나, 진행자가 수업을 열었는지 확인해 주세요.' : '연결하지 못했습니다. 네트워크를 확인하고 다시 시도해 주세요.');
    });
    peer.on('disconnected', () => { if (!S.ended) peer.reconnect(); });
    peer.on('call', (call) => { call.answer(); call.on('stream', playHost); });
    peer.on('open', (id) => {
      if (done) { say($('#hostAudio').srcObject ? '진행자 목소리 연결됨' : '진행자 목소리를 기다리는 중…'); return; }
      const conn = peer.connect(hostPeerId(code), { reliable: true });
      conn.on('open', () => conn.send({ t: 'hello', name: S.name, avatar: S.avatar }));
      conn.on('data', (msg) => {
        if (!msg || typeof msg !== 'object') return;
        if (msg.t === 'full') { clearTimeout(timer); fail('수업 정원이 가득 찼습니다.'); }
        else if (msg.t === 'room') { clearTimeout(timer); done = true; S.peer = peer; S.hostConn = conn; S.code = code; S.myId = id; setBg(msg.bg); for (const m of msg.members || []) addMember(m); resolve(); }
        else if (msg.t === 'join') addMember(msg.m);
        else if (msg.t === 'leave') removeMember(msg.id);
        else if (msg.t === 'avatar') setAvatar(msg.id, msg.avatar);
        else if (msg.t === 'bg') setBg(msg.bg);
        else if (msg.t === 'ps') { for (const pid in msg.a) { if (pid === S.myId) continue; const mem = members.get(pid); if (mem) applyPacket(mem, msg.a[pid], false); } }
        else if (msg.t === 'end') endClass('진행자가 수업을 마쳤습니다. 함께해 주셔서 고맙습니다.');
      });
      conn.on('close', () => { if (done) endClass('수업과의 연결이 끊겼습니다. 수업이 끝났거나 네트워크가 불안정할 수 있습니다.'); });
    });
  });
}
function playHost(stream) {
  const a = $('#hostAudio'); a.srcObject = stream;
  a.play().then(() => { $('#unmute').hidden = true; say('진행자 목소리 연결됨'); }).catch(() => { $('#unmute').hidden = false; });
}
$('#unmute').addEventListener('click', () => { $('#hostAudio').play().then(() => { $('#unmute').hidden = true; say('진행자 목소리 연결됨'); }).catch(() => {}); });

let lastSend = 0;
function netTick(now) {
  if (!S.peer || now - lastSend < SEND_MS) return;
  lastSend = now;
  const fresh = myPacket && now - myPacketAt < 900;
  if (S.role === 'host') {
    if (!S.conns.size) return;
    const a = {};
    if (fresh) a[S.myId] = myPacket;
    for (const [id] of S.conns) { const mem = members.get(id); if (mem?.raw && now - mem.lastSeen < 900) a[id] = mem.raw; }
    if (Object.keys(a).length) cast({ t: 'ps', a });
  } else if (fresh && S.hostConn?.open) S.hostConn.send({ t: 'p', k: myPacket });
}

/* ---------- 화면 ---------- */
function setBg(id) {
  if (!BGS.some((g) => g.id === id)) id = BGS[0].id;
  if (S.bg === id && $('#bg').getAttribute('src')) return;
  S.bg = id;
  $('#bg').src = bgUrl(id);
}
function toBar() {
  const bar = $('#bar'); bar.replaceChildren();
  const add = (label, on, fn, cls) => { const b = el('button', 'btn' + (cls ? ' ' + cls : ''), label); b.type = 'button'; if (on != null) b.setAttribute('aria-pressed', String(on)); b.addEventListener('click', fn); bar.append(b); return b; };
  if (S.role === 'host') add(S.micOn ? '마이크 켜짐' : '마이크 꺼짐', S.micOn, toggleMic);
  add(S.camOn ? '카메라 켜짐' : '카메라 꺼짐', S.camOn, toggleCam);
  add('아바타', null, () => openSheet('avatar'));
  if (S.role === 'host') { add('배경·소리', null, () => openSheet('host')); add('초대', null, invite); }
  add(S.role === 'host' ? '수업 종료' : '나가기', null, leave, 'danger');
}
function openSheet(kind) {
  const sh = $('#sheet'); sh.replaceChildren(); sh.hidden = false;
  const close = el('button', 'chip', '닫기'); close.type = 'button'; close.addEventListener('click', () => { sh.hidden = true; });
  if (kind === 'avatar') {
    sh.append(el('h2', null, '내 아바타'));
    const row = el('div', 'row');
    avatarRow(row, (id) => { pickAvatar(id); sh.hidden = true; });
    sh.append(row);
  } else {
    sh.append(el('h2', null, '배경 (모두에게 바뀝니다)'));
    const row = el('div', 'row');
    for (const g of BGS) { const b = el('button', 'thumb'); b.type = 'button'; b.setAttribute('aria-label', g.label); b.setAttribute('aria-pressed', String(g.id === S.bg)); b.style.backgroundImage = `url(${bgUrl(g.id, true)})`; b.addEventListener('click', () => { setBg(g.id); cast({ t: 'bg', bg: g.id }); openSheet('host'); }); row.append(b); }
    sh.append(row, el('h2', null, '소리'));
    const row2 = el('div', 'row'), bowl = el('button', 'chip', '싱잉볼 모드 (잡음 제거 끔)'); bowl.type = 'button'; bowl.setAttribute('aria-pressed', String(S.bowl));
    bowl.addEventListener('click', async () => { S.bowl = !S.bowl; await startMic(); openSheet('host'); });
    row2.append(bowl); sh.append(row2);
  }
  sh.append(close);
}
function avatarRow(row, onPick) {
  row.replaceChildren();
  for (const a of AVATARS) {
    const b = el('button', 'thumb av'); b.type = 'button'; b.title = a.label; b.setAttribute('aria-label', a.label); b.setAttribute('aria-pressed', String(a.id === S.avatar));
    b.style.backgroundImage = `url(avatars/thumb-${a.id}.webp)`;
    b.addEventListener('click', () => onPick(a.id));
    row.append(b);
  }
  row.querySelector('[aria-pressed="true"]')?.scrollIntoView({ block: 'nearest', inline: 'center' });
}
function pickAvatar(id) {
  S.avatar = id; try { localStorage.setItem('medclass-avatar', id); } catch (e) { /* 무시 */ }
  if (!S.myId) return;
  setAvatar(S.myId, id);
  if (S.role === 'host') cast({ t: 'avatar', id: S.myId, avatar: id }); else if (S.hostConn?.open) S.hostConn.send({ t: 'avatar', avatar: id });
}
async function startMic() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia(micConstraints());
    const track = stream.getAudioTracks()[0]; track.enabled = S.micOn;
    const old = S.mic; S.mic = stream;
    for (const [id, call] of S.calls) { const snd = call.peerConnection?.getSenders().find((x) => x.track?.kind === 'audio'); if (snd) snd.replaceTrack(track); else if (S.conns.has(id)) S.calls.set(id, S.peer.call(id, stream)); }
    for (const [id] of S.conns) if (!S.calls.has(id)) S.calls.set(id, S.peer.call(id, stream));
    old?.getTracks().forEach((t) => t.stop());
    return true;
  } catch (err) { console.warn(err); return false; }
}
function toggleMic() { S.micOn = !S.micOn; S.mic?.getAudioTracks().forEach((t) => { t.enabled = S.micOn; }); if (S.micOn && !S.mic) startMic().then((ok) => { if (!ok) { S.micOn = false; say('마이크를 쓸 수 없습니다. 브라우저 설정에서 허용해 주세요.', true); } toBar(); }); toBar(); hostStatus(); }
async function toggleCam() {
  if (S.camOn) { stopCamera(); toBar(); return; }
  say('카메라 준비 중…');
  const ok = await startCamera(); toBar();
  say(ok ? '카메라 켜짐 · 아바타가 따라 움직입니다' : '카메라를 쓸 수 없습니다. 브라우저 설정에서 허용해 주세요.', !ok);
}
const hostStatus = () => say(!S.mic ? '마이크 없음 · 참가자에게 소리가 가지 않습니다' : S.micOn ? '마이크 송출 중' : '마이크 꺼짐', !S.mic);
const inviteUrl = () => `${location.origin}${location.pathname}?room=${S.code}`;
async function invite() {
  const text = `명상 클래스에 초대합니다. 수업 코드: ${S.code}`;
  try { if (navigator.share) { await navigator.share({ title: '명상 클래스', text, url: inviteUrl() }); return; } } catch (e) { if (e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(`${text}\n${inviteUrl()}`); say('초대 링크를 복사했습니다'); } catch (e) { say(inviteUrl()); }
}
function leave() {
  if (S.role === 'host') { cast({ t: 'end' }); setTimeout(() => endClass('수업을 마쳤습니다.'), 250); } else endClass('수업에서 나왔습니다.');
}
function endClass(msg) {
  if (S.ended) return; S.ended = true;
  stopCamera(); S.mic?.getTracks().forEach((t) => t.stop());
  try { S.peer?.destroy(); } catch (e) { /* 무시 */ }
  wake?.release?.().catch(() => {});
  $('#sheet').hidden = true; $('#unmute').hidden = true;
  $('#overMsg').textContent = msg; $('#over').hidden = false;
}
$('#overBtn').addEventListener('click', () => { location.href = location.pathname; });

let wake = null;
async function keepAwake() { try { wake = await navigator.wakeLock?.request('screen'); } catch (e) { /* 지원 안 함 */ } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.peer && !S.ended) keepAwake(); });

/* ---------- 로비 ---------- */
let mode = 'join';
function setMode(m) {
  mode = m;
  $('#tabJoin').setAttribute('aria-selected', String(m === 'join')); $('#tabHost').setAttribute('aria-selected', String(m === 'host'));
  $('#codeWrap').hidden = m === 'host';
  $('#enter').textContent = m === 'host' ? '수업 열기' : '참가하기';
  $('#lobbyNote').textContent = m === 'host' ? '수업을 열면 마이크와 카메라 사용을 묻습니다. 마이크는 진행 목소리를 보내는 데, 카메라는 아바타를 움직이는 데만 씁니다.' : '입장할 때 카메라 사용을 묻습니다. 허용하지 않아도 참가할 수 있고, 그 경우 아바타는 가만히 앉아 있습니다.';
  $('#lobbyErr').hidden = true;
}
$('#tabJoin').addEventListener('click', () => setMode('join'));
$('#tabHost').addEventListener('click', () => setMode('host'));
const lobbyErr = (t) => { const e = $('#lobbyErr'); e.textContent = t; e.hidden = false; };
$('#enter').addEventListener('click', async () => {
  const btn = $('#enter'), name = $('#name').value.trim(), code = $('#code').value.trim().toUpperCase();
  $('#lobbyErr').hidden = true;
  if (!name) { lobbyErr('이름을 입력해 주세요.'); $('#name').focus(); return; }
  if (mode === 'join' && !/^[A-Z0-9]{6}$/.test(code)) { lobbyErr('수업 코드 6자리를 입력해 주세요.'); $('#code').focus(); return; }
  if (typeof Peer === 'undefined') { lobbyErr('연결 모듈을 불러오지 못했습니다. 새로고침해 주세요.'); return; }
  btn.disabled = true; btn.textContent = '연결 중…';
  S.name = name.slice(0, 12); S.role = mode;
  try { localStorage.setItem('medclass-name', S.name); } catch (e) { /* 무시 */ }
  try {
    if (mode === 'host') { await openHost(); addMember({ id: S.myId, name: S.name, avatar: S.avatar, host: true }); await startMic(); }
    else await joinRoom(code);
  } catch (err) {
    console.error(err); btn.disabled = false; setMode(mode);
    lobbyErr(err.message && /[가-힣]/.test(err.message) ? err.message : '수업에 연결하지 못했습니다. 네트워크를 확인하고 다시 시도해 주세요.');
    return;
  }
  $('#lobby').hidden = true; $('#room').hidden = false;
  $('#codePill').textContent = `코드 ${S.code}`;
  setBg(S.bg); layout(); resize(); keepAwake();
  if (S.role === 'host') hostStatus(); else say('진행자 목소리를 기다리는 중…');
  toBar();
  await startCamera(); toBar();
  if (S.role === 'join' && !S.camOn) say('카메라 없이 참가 중 · 아바타는 가만히 앉아 있습니다');
});
addEventListener('pagehide', () => { if (S.role === 'host' && !S.ended) cast({ t: 'end' }); });

/* ---------- 루프 ---------- */
function resize() { renderer.setSize(innerWidth, innerHeight, false); }
addEventListener('resize', resize);
const clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.1), now = performance.now(), t = clock.elapsedTime;
  track(now); netTick(now);
  renderer.setScissor(0, 0, innerWidth, innerHeight); renderer.setViewport(0, 0, innerWidth, innerHeight); renderer.clear();
  if ($('#room').hidden) return;
  const a = 1 - Math.pow(0.0005, dt * 4), tan = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  for (const mem of members.values()) {
    const lost = now - mem.lastSeen > 900, p = mem.pose;
    for (const k of KEYS) p.blend[k] = THREE.MathUtils.lerp(p.blend[k] || 0, lost ? 0 : mem.target.blend[k] || 0, a);
    if (lost) mem.target.quat.identity();
    p.quat.slerp(mem.target.quat, lost ? a * 0.3 : a); p.euler.setFromQuaternion(p.quat);
    const inst = mem.inst; if (!inst || !mem.slot) continue;
    inst.update(p, dt, t);
    const r = mem.slot.getBoundingClientRect(); if (r.width < 8 || r.height < 8) continue;
    const y = innerHeight - r.bottom;
    renderer.setViewport(r.left, y, r.width, r.height); renderer.setScissor(r.left, y, r.width, r.height);
    camera.aspect = r.width / r.height;
    const dist = Math.max(inst.halfH / tan, inst.halfW / (tan * camera.aspect)) * 1.04;
    const up = Math.max(0, dist * tan - inst.halfH * 1.04); // 가로 폭에 맞춰질 때는 슬롯 바닥에 붙여 앉힌다
    camera.position.set(0, up, dist); camera.lookAt(0, up, 0); camera.updateProjectionMatrix();
    inst.root.visible = true; renderer.render(scene, camera); inst.root.visible = false;
  }
}

/* ---------- 시작 ---------- */
window.__cls = { S, members, setMyPacket, enc, repose: () => { for (const m of members.values()) loadInst(m); } };
try { const n = localStorage.getItem('medclass-name'); if (n) $('#name').value = n; const av = localStorage.getItem('medclass-avatar'); if (AVATARS.some((a) => a.id === av)) S.avatar = av; } catch (e) { /* 무시 */ }
const lobbyPick = (id) => { pickAvatar(id); avatarRow($('#lobbyAv'), lobbyPick); };
avatarRow($('#lobbyAv'), lobbyPick);
const preset = new URLSearchParams(location.search).get('room');
if (preset && /^[A-Za-z0-9]{6}$/.test(preset)) $('#code').value = preset.toUpperCase();
setBg(S.bg); resize(); tick();
</script>
</body>
