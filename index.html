<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>명상 클래스</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d1110;color:#f3f1ea;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
[hidden]{display:none!important}
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center bottom}
#shade{position:fixed;inset:0;background:linear-gradient(to bottom,rgba(13,17,16,.25),rgba(13,17,16,0) 22%,rgba(13,17,16,0) 55%,rgba(13,17,16,.7))}
#gl{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}

/* 로비 */
#lobby{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(13,17,16,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);overflow:auto}
.card{width:100%;max-width:380px;padding:22px;border-radius:22px;background:rgba(19,26,23,.88);border:1px solid rgba(255,255,255,.12)}
.card h1{margin:0 0 4px;font-size:24px;font-weight:600}
.card p.sub{margin:0 0 16px;font-size:13.5px;line-height:1.55;color:#c3cbc2}
.tabs{display:flex;gap:6px;padding:4px;border-radius:999px;background:rgba(255,255,255,.07);margin-bottom:16px}
.tabs button{flex:1;min-height:40px;border:0;border-radius:999px;background:transparent;font-size:14.5px}
.tabs button[aria-selected="true"]{background:#e9e2cf;color:#17201b;font-weight:600}
label.f{display:block;font-size:12.5px;color:#b9c2b8;margin:12px 2px 6px}
input.t{width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);font-size:16px}
input.code{letter-spacing:.3em;text-transform:uppercase;font-weight:600}
.primary{width:100%;min-height:52px;margin-top:18px;border:0;border-radius:999px;background:#e9e2cf;color:#17201b;font-size:16px;font-weight:600}
.primary:disabled{opacity:.6}
.ghost{width:100%;min-height:44px;margin-top:8px;border:0;border-radius:999px;background:transparent;color:#c9d1c8;font-size:14px;text-decoration:underline}
.note{margin:12px 2px 0;font-size:12px;line-height:1.5;color:#aab3a9}
.err{margin:12px 2px 0;font-size:13px;line-height:1.5;color:#ffb4a8}

/* 수업방 */
#room{position:fixed;inset:0;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom))}
#top{display:flex;align-items:center;gap:8px;min-height:36px}
.pill{padding:7px 12px;border-radius:999px;background:rgba(13,17,16,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:12.5px;line-height:1.3;white-space:nowrap}
#status{white-space:normal;margin-left:auto;text-align:right;max-width:58%}
#status.bad{background:rgba(120,30,24,.85)}
#stage{flex:1;min-height:0}
.slot{position:fixed;pointer-events:none}
.slot .nm{position:absolute;left:50%;top:100%;transform:translate(-50%,-70%);max-width:130%;padding:2px 8px;border-radius:999px;background:rgba(13,17,16,.55);font-size:11px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.host .nm{font-size:12.5px;padding:3px 11px;top:0;transform:translate(-50%,-115%)}
.slot .ld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;color:#d6dbd3}
#empty{position:fixed;left:50%;transform:translateX(-50%);width:max-content;max-width:86%;text-align:center;white-space:pre-line;font-size:13px;line-height:1.6;color:#e6e9e2;padding:10px 14px;border-radius:14px;background:rgba(13,17,16,.5)}
#bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding-top:8px}
.btn{min-height:44px;padding:0 15px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(13,17,16,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:14px}
.btn[aria-pressed="true"]{background:#e9e2cf;color:#17201b;border-color:#e9e2cf;font-weight:600}
.btn.danger{border-color:rgba(255,160,146,.6);color:#ffc9bf}
#sheet{position:fixed;left:0;right:0;bottom:0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0;background:rgba(19,26,23,.96);border-top:1px solid rgba(255,255,255,.14)}
#sheet h2{margin:0 0 10px;font-size:15px;font-weight:600}
.row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:44px;padding:0 15px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.07);font-size:14px}
.chip[aria-pressed="true"]{background:#e9e2cf;color:#17201b;border-color:#e9e2cf;font-weight:600}
.thumb{flex:0 0 auto;width:60px;height:60px;border-radius:12px;border:2px solid transparent;background-size:cover;background-position:center;padding:0}
.thumb[aria-pressed="true"]{border-color:#e9e2cf}
.thumb.av{width:72px;height:84px;background-color:rgba(255,255,255,.08);background-size:contain;background-repeat:no-repeat}
#over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:rgba(13,17,16,.8)}
#over p{margin:0;max-width:30ch;font-size:15px;line-height:1.6}
#over button{min-height:48px;padding:0 24px;border:0;border-radius:999px;background:#e9e2cf;color:#17201b;font-weight:600}
#unmute{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);min-height:52px;padding:0 24px;border:0;border-radius:999px;background:#e9e2cf;color:#17201b;font-size:16px;font-weight:600}
</style>
<script type="importmap">
{"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
}}
</script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<img id="bg" alt="">
<div id="shade"></div>
<canvas id="gl"></canvas>
<video id="cam" muted playsinline hidden></video>
<audio id="hostAudio" autoplay playsinline></audio>

<div id="room" hidden>
  <div id="top">
    <span class="pill" id="codePill"></span>
    <span class="pill" id="countPill"></span>
    <span class="pill" id="status" role="status"></span>
  </div>
  <div id="stage"></div>
  <div id="bar"></div>
</div>

<div id="sheet" hidden></div>
<button id="unmute" type="button" hidden>소리 켜기</button>

<div id="lobby">
  <div class="card">
    <h1>명상 클래스</h1>
    <p class="sub">진행자의 목소리를 들으며 아바타로 함께 앉습니다. 카메라 영상은 전송되지 않고, 표정과 고개 움직임 수치만 오갑니다.</p>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tabJoin" aria-selected="true">참가하기</button>
      <button type="button" role="tab" id="tabHost" aria-selected="false">수업 열기</button>
    </div>
    <label class="f" for="name">이름</label>
    <input class="t" id="name" maxlength="12" autocomplete="nickname" placeholder="수업에서 보일 이름">
    <label class="f" id="avLabel">캐릭터</label>
    <div class="row" id="lobbyAv" role="group" aria-labelledby="avLabel"></div>
    <div id="codeWrap">
      <label class="f" for="code">수업 코드</label>
      <input class="t code" id="code" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="ABC123">
    </div>
    <button class="primary" id="enter" type="button">참가하기</button>
    <button class="ghost" id="fresh" type="button" hidden>새 코드로 수업 열기</button>
    <p class="note" id="lobbyNote">입장할 때 카메라 사용을 묻습니다. 허용하지 않아도 참가할 수 있고, 그 경우 아바타는 가만히 앉아 있습니다.</p>
    <p class="err" id="lobbyErr" role="alert" hidden></p>
  </div>
</div>

<div id="over" hidden><p id="overMsg"></p><button type="button" id="overBtn">처음으로</button></div>

<script type="module">
import * as THREE from 'three';

const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const FACE_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
// neck: 목 위치, split: 눈과 입 사이 높이 (둘 다 이미지 위에서부터의 비율). hx·hw: 머리 가운데와 반폭(그림 높이를 1로 본 단위). side: 손을 드는 쪽(-1 화면 왼쪽). ex·ey: 든 팔의 팔꿈치 위치(그림 가운데 기준)
const AVATARS = [
  { id: 'track', label: '트레이닝복', neck: 0.260, split: 0.18, hx: -0.005, hw: 0.092, side: -1, ex: -0.244, ey: 0.035 },
  { id: 'home', label: '홈웨어', neck: 0.299, split: 0.206, hx: -0.003, hw: 0.134, side: -1, ex: -0.256, ey: 0.005 },
  { id: 'yoga', label: '요가복', neck: 0.283, split: 0.195, hx: -0.011, hw: 0.136, side: -1, ex: -0.236, ey: 0.019 },
  { id: 'hanbok', label: '생활한복', neck: 0.266, split: 0.184, hx: -0.002, hw: 0.089, side: -1, ex: -0.288, ey: 0.023 },
  { id: 'knit', label: '니트', neck: 0.285, split: 0.196, hx: -0.0, hw: 0.128, side: -1, ex: -0.253, ey: 0.032 },
  { id: 'hoodie', label: '후드티', neck: 0.262, split: 0.181, hx: -0.004, hw: 0.11, side: -1, ex: -0.258, ey: 0.036 },
  { id: 'bear', label: '곰', neck: 0.318, split: 0.22, hx: 0.0, hw: 0.197, side: -1, ex: -0.234, ey: 0.091 },
  { id: 'cat', label: '고양이', neck: 0.366, split: 0.252, hx: 0.007, hw: 0.208, side: -1, ex: -0.203, ey: 0.063 },
];
// floor: 배경 그림에서 바닥이 시작되는 높이(위에서부터의 비율)
const BGS = [
  { id: 'center', label: '명상 센터', floor: 0.575 }, { id: 'temple', label: '산사', floor: 0.595 }, { id: 'bamboo', label: '대나무 숲', floor: 0.585 },
  { id: 'beach', label: '바닷가', floor: 0.56 }, { id: 'mountain', label: '산', floor: 0.545 }, { id: 'night', label: '밤하늘', floor: 0.605 },
];
const bgUrl = (id, thumb) => `bg/${thumb ? 'thumb-' : ''}${id}.jpg`;
const KEYS = ['eyeBlinkLeft', 'eyeBlinkRight', 'jawOpen', 'mouthFunnel', 'mouthPucker', 'mouthSmileLeft', 'mouthSmileRight'];
const MAX_GUESTS = 12, SEND_MS = 85, PREFIX = 'sunmedclass-';
const HAND_MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const GEST = [null, 'pray', 'up', 'up']; // 손동작 번호: 1 합장, 2 손 들기 (3은 예전 버전의 손 흔들기, 2와 같게 처리)
const AWAY_MS = 6000, WALK_S = 2.4, SIT_S = 0.8, STAND_H = 1.72;
const $ = (s) => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const clamp = THREE.MathUtils.clamp, lerp = THREE.MathUtils.lerp;
const ease = (k) => k * k * (3 - 2 * k);

/* ---------- 그리기 ---------- */
const canvas = $('#gl');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(0, 1, 1, 0, -10, 10); // 화면 픽셀 좌표 그대로 (y는 위쪽이 +)
const texLoader = new THREE.TextureLoader();
const texCache = new Map();
const loadTex = (url) => {
  if (!texCache.has(url)) texCache.set(url, texLoader.loadAsync(url).then((t) => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; }));
  return texCache.get(url);
};
const shadowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), r = g.createRadialGradient(64, 64, 4, 64, 64, 64);
  r.addColorStop(0, 'rgba(0,0,0,.45)'); r.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = r; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
})();
const VERT = `
uniform vec3 uRot; uniform vec2 uLean; uniform float uNeck; uniform float uBreath; uniform float uW;
uniform vec2 uHead;
varying vec2 vUv; varying vec2 vL;
void main() {
  vUv = uv; vL = position.xy;
  vec2 p = position.xy;
  float torso = smoothstep(-0.32, 0.05, p.y);
  p.y += uBreath * torso * 0.006;
  p.x *= 1.0 + uBreath * torso * 0.004;
  // 고개: 목 위쪽, 머리 폭 안쪽만 휜다 (든 손은 따라 움직이지 않게)
  float w = smoothstep(uNeck - 0.035, uNeck + 0.05, position.y) * (1.0 - smoothstep(uHead.y * 1.05, uHead.y * 1.45, abs(position.x - uHead.x)));
  vec2 q = p - vec2(0.0, uNeck);
  float c = cos(uRot.z * w), s = sin(uRot.z * w);
  q = vec2(c * q.x - s * q.y, s * q.x + c * q.y);
  q.x = q.x * (1.0 - 0.10 * abs(uRot.y) * w) + uRot.y * 0.085 * uW * w;
  q.y = q.y * (1.0 - 0.16 * uRot.x * w) - uRot.x * 0.012 * w;
  p = q + vec2(0.0, uNeck);
  // 몸: 엉덩이를 축으로 상체가 기운다
  float wl = smoothstep(-0.36, 0.12, position.y);
  vec2 hip = vec2(0.0, -0.27);
  vec2 r = p - hip;
  float a = -uLean.x * 0.24 * wl;
  float ca = cos(a), sa = sin(a);
  r = vec2(ca * r.x - sa * r.y, sa * r.x + ca * r.y);
  r.y *= 1.0 - 0.07 * uLean.y * wl;
  p = r + hip;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 0.0, 1.0);
}`;
// 얼굴(머리 폭 안쪽, 목 위)은 눈 뜬·감은·말하는 그림을 섞고, 그 밖의 몸은 기본 그림과 손동작 그림을 섞는다
const FRAG = `
uniform sampler2D tOpen; uniform sampler2D tClosed; uniform sampler2D tTalk; uniform sampler2D tPose;
uniform float uBlink; uniform float uTalk; uniform float uPose; uniform float uAlpha;
uniform float uNeck; uniform float uSplit; uniform vec2 uHead;
varying vec2 vUv; varying vec2 vL;
void main() {
  vec4 o = texture2D(tOpen, vUv);
  vec4 eyes = mix(o, texture2D(tClosed, vUv), uBlink);
  vec4 mouth = mix(o, texture2D(tTalk, vUv), uTalk);
  vec4 head = mix(mouth, eyes, smoothstep(uSplit - 0.012, uSplit + 0.012, vL.y));
  vec4 body = mix(o, texture2D(tPose, vUv), uPose);
  float hm = smoothstep(uNeck - 0.004, uNeck + 0.028, vL.y) * (1.0 - smoothstep(uHead.y, uHead.y * 1.16, abs(vL.x - uHead.x)));
  gl_FragColor = mix(body, head, hm);
  gl_FragColor.a *= uAlpha;
  if (gl_FragColor.a < 0.01) discard;
  #include <colorspace_fragment>
}`;

// 앉은 그림(고개·몸 움직임, 눈 뜬/감은 그림 혼합) + 서 있는 그림(걸어 들어오고 나갈 때)
async function makeAvatar(defId) {
  const def = AVATARS.find((a) => a.id === defId) || AVATARS[0];
  const [tOpen, tClosed, tStand, tTalk] = await Promise.all([
    loadTex(`avatars/${def.id}-open.webp`), loadTex(`avatars/${def.id}-closed.webp`),
    loadTex(`avatars/${def.id}-stand.webp`).catch(() => null), loadTex(`avatars/${def.id}-talk.webp`).catch(() => null),
  ]);
  const W = tOpen.image.width / tOpen.image.height;
  const mat = new THREE.ShaderMaterial({ vertexShader: VERT, fragmentShader: FRAG, transparent: true, depthTest: false,
    uniforms: { tOpen: { value: tOpen }, tClosed: { value: tClosed }, tTalk: { value: tTalk || tOpen }, tPose: { value: tOpen }, uBlink: { value: 0 }, uTalk: { value: 0 }, uPose: { value: 0 }, uAlpha: { value: 1 }, uRot: { value: new THREE.Vector3() }, uLean: { value: new THREE.Vector2() }, uNeck: { value: 0.5 - def.neck }, uSplit: { value: 0.5 - def.split }, uHead: { value: new THREE.Vector2(def.hx, def.hw) }, uBreath: { value: 0 }, uW: { value: W } } });
  let poseName = null, poseK = 0, poseBusy = false, armA = 1.55, armV = 0;
  // 든 팔의 팔뚝과 손은 따로 떼어 팔꿈치를 축으로 돌린다 (손 위치를 따라 움직이게)
  const armMat = new THREE.MeshBasicMaterial({ transparent: true, depthTest: false, opacity: 0 });
  const armMesh = new THREE.Mesh(new THREE.PlaneGeometry(W, 1), armMat);
  armMesh.position.set(-def.ex, -def.ey, 0);
  const arm = new THREE.Group(); arm.add(armMesh); arm.visible = false;
  const body = new THREE.Mesh(new THREE.PlaneGeometry(W, 1, 24, 48), mat);
  body.position.y = 0.5;
  const shMat = new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthTest: false });
  const sh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), shMat);
  sh.position.y = 0.035; sh.scale.set(W * 1.15, 0.13, 1);
  let stand = null, stMat = null;
  if (tStand) {
    stMat = new THREE.MeshBasicMaterial({ map: tStand, transparent: true, depthTest: false });
    stand = new THREE.Mesh(new THREE.PlaneGeometry(STAND_H * tStand.image.width / tStand.image.height, STAND_H), stMat);
    stand.visible = false;
  }
  const root = new THREE.Group(); root.add(sh, body, arm); if (stand) root.add(stand);
  root.visible = false;
  return {
    defId: def.id, root,
    // seat: 앉은 그림의 불투명도(0~1), up: 서 있는 그림의 불투명도, squat: 앉는 중 정도(0 선 자세 ~ 1 다 앉음), step: 걸음 위상
    draw(p, t, dt, order, seat, up, squat, step) {
      const u = mat.uniforms;
      // 손동작: 다른 동작으로 바뀔 때는 먼저 기본 자세로 돌아갔다가 넘어간다
      const want = GEST[p.g] || null;
      if (want && want !== poseName) {
        if (poseK > 0.01) poseK -= dt * 3.2;
        else if (!poseBusy) {
          poseBusy = true;
          const files = want === 'up' ? [`avatars/${def.id}-upb.webp`, `avatars/${def.id}-arm.webp`] : [`avatars/${def.id}-${want}.webp`];
          Promise.all(files.map(loadTex)).then(([tb, ta]) => { u.tPose.value = tb; if (ta) { armMat.map = ta; armMat.needsUpdate = true; } poseName = want; }).catch(() => {}).finally(() => { poseBusy = false; });
        }
      } else poseK += (want ? 1 : -1) * dt * 3.2;
      poseK = clamp(poseK, 0, 1);
      const isUp = poseName === 'up' && poseK > 0.001;
      u.uPose.value = isUp ? clamp(poseK / 0.45, 0, 1) : ease(poseK);
      // 팔뚝: 옆으로 내린 각도(1.55)에서 올라와 손 위치(p.ha)를 따라간다. 약한 스프링으로 살짝 출렁이게 한다
      const goal = isUp ? lerp(1.55, p.ha, ease(poseK)) : 1.55;
      for (let left = dt; left > 0; left -= 1 / 120) { const h = Math.min(left, 1 / 120); armV += ((goal - armA) * 130 - armV * 15) * h; armA += armV * h; } // 화면이 느려도 출렁임이 튀지 않게 잘게 나눠 계산
      if (!isUp) { armA = 1.55; armV = 0; }
      arm.visible = isUp && seat > 0.01 && !!armMat.map;
      if (arm.visible) {
        const wl = THREE.MathUtils.smoothstep(def.ey, -0.36, 0.12), la = -p.lean.x * 0.24 * wl;
        const rx = def.ex, ry = (def.ey + 0.27) * (1 - 0.07 * p.lean.y * wl), cl = Math.cos(la), sl = Math.sin(la);

  $('#lobbyNote').textContent = m === 'host' ? '수업을 열면 마이크와 카메라 사용을 묻습니다. 마이크는 진행 목소리를 보내는 데, 카메라는 아바타를 움직이는 데만 씁니다.' : '입장할 때 카메라 사용을 묻습니다. 허용하지 않아도 참가할 수 있고, 그 경우 아바타는 가만히 앉아 있습니다.';
  $('#lobbyErr').hidden = true;
}
$('#tabJoin').addEventListener('click', () => setMode('join'));
$('#tabHost').addEventListener('click', () => setMode('host'));
$('#fresh').addEventListener('click', () => { forgetHost(); setMode('host'); });
const lobbyErr = (t) => { const e = $('#lobbyErr'); e.textContent = t; e.hidden = false; };
$('#enter').addEventListener('click', async () => {
  if (S.cancelJoin) { S.cancelJoin(); return; } // 기다리는 중에 다시 누르면 취소
  const btn = $('#enter'), name = $('#name').value.trim(), code = $('#code').value.trim().toUpperCase();
  $('#lobbyErr').hidden = true;
  if (!name) { lobbyErr('이름을 입력해 주세요.'); $('#name').focus(); return; }
  if (mode === 'join' && !/^[A-Z0-9]{6}$/.test(code)) { lobbyErr('수업 코드 6자리를 입력해 주세요.'); $('#code').focus(); return; }
  if (typeof Peer === 'undefined') { lobbyErr('연결 모듈을 불러오지 못했습니다. 새로고침해 주세요.'); return; }
  btn.disabled = true; btn.textContent = '연결 중…';
  S.name = name.slice(0, 12); S.role = mode;
  try { localStorage.setItem('medclass-name', S.name); } catch (e) { /* 무시 */ }
  await getIce();
  try {
    if (mode === 'host') {
      const sv = savedHost();
      if (sv) { S.bg = BGS.some((g) => g.id === sv.bg) ? sv.bg : S.bg; S.awayOn = sv.awayOn !== false; }
      await openHost(sv ? sv.code : null); saveHost();
      addMember({ id: S.myId, name: S.name, avatar: S.avatar, host: true }, true); await startMic();
    }
    else await joinRoom(code);
  } catch (err) {
    console.error(err); btn.disabled = false; S.role = null; setMode(mode);
    lobbyErr(err.message && /[가-힣]/.test(err.message) ? err.message : '수업에 연결하지 못했습니다. 네트워크를 확인하고 다시 시도해 주세요.');
    return;
  }
  $('#lobby').hidden = true; $('#room').hidden = false;
  $('#codePill').textContent = `코드 ${S.code}`;
  setBg(S.bg); resize(); keepAwake();
  if (S.role === 'host') hostStatus(); else say('진행자 목소리를 기다리는 중…');
  toBar(); layout();
  for (const m of members.values()) if (m.st === 'entering') m.t0 = performance.now(); // 방이 보이는 순간부터 걸어 들어오게
  await startCamera(); toBar();
  if (S.role === 'join' && !S.camOn) say('카메라 없이 참가 중 · 아바타는 가만히 앉아 있습니다');
});
// 진행자가 창을 닫거나 다른 앱으로 가도 수업을 끝내지 않는다. 끝내는 건 '수업 종료' 버튼뿐이다

/* ---------- 루프 ---------- */
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.right = innerWidth; camera.top = innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', () => { resize(); place(); });
const clock = new THREE.Clock();
function animate(mem, now, dt, t, a) {
  const inst = mem.inst, seat = mem.seat || mem.cur; if (!inst || !seat || !mem.cur) return;
  const c = mem.cur, p = mem.pose, W = innerWidth;
  const lost = now - mem.lastSeen > 900;
  for (const k of KEYS) p.blend[k] = lerp(p.blend[k] || 0, lost ? 0 : mem.target.blend[k] || 0, a);
  if (lost) { mem.target.quat.identity(); mem.target.lean.set(0, 0); }
  p.quat.slerp(mem.target.quat, lost ? a * 0.3 : a); p.euler.setFromQuaternion(p.quat);
  p.lean.lerp(mem.target.lean, a * 0.5);
  p.talk = lerp(p.talk, clamp(((p.blend.jawOpen || 0) - 0.06) / 0.28, 0, 1), a);
  p.g = lost ? 0 : mem.target.g;
  p.ha = lerp(p.ha, mem.target.ha, a);
  // 자리가 바뀌면 부드럽게 옮겨 앉는다
  const m = 1 - Math.pow(0.02, dt);
  c.base = lerp(c.base, seat.base, m); c.h = lerp(c.h, seat.h, m);
  const edge = seat.x < W / 2 ? -seat.h * 0.5 : W + seat.h * 0.5;
  let x = c.x = lerp(c.x, seat.x, m), sit = 1, up = 0, squat = 1, step = 0;
  const u = (now - mem.t0) / 1000;
  if (mem.st === 'wait' || mem.st === 'gone') { inst.root.visible = false; return; }
  if (mem.st === 'entering') {
    if (u < WALK_S) { x = lerp(edge, seat.x, ease(u / WALK_S)); sit = 0; up = Math.min(1, u * 4); squat = 0; step = u * 9; }
    else if (u < WALK_S + SIT_S) { const k = ease((u - WALK_S) / SIT_S); sit = k; up = 1 - k; squat = k; }
    else { mem.st = 'seated'; label(mem); }
  } else if (mem.st === 'leaving') {
    if (u < SIT_S) { const k = ease(u / SIT_S); sit = 1 - k; up = k; squat = 1 - k; }
    else if (u < SIT_S + WALK_S) { const v = (u - SIT_S) / WALK_S; x = lerp(seat.x, edge, ease(v)); sit = 0; up = Math.min(1, (1 - v) * 4); squat = 0; step = v * WALK_S * 9; }
    else { mem.st = 'gone'; label(mem); inst.root.visible = false; return; }
  }
  inst.root.visible = true;
  inst.root.position.set(x, innerHeight - c.base, 0);
  inst.root.scale.setScalar(c.h);
  inst.draw(p, t, dt, Math.round(c.base) * 2, sit, up, squat, step);
}
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.1), now = performance.now(), t = clock.elapsedTime;
  track(now); netTick(now);
  if ($('#room').hidden) { renderer.clear(); return; }
  const a = 1 - Math.pow(0.0005, dt * 4);
  for (const mem of order) animate(mem, now, dt, t, a);
  for (let i = ghosts.length - 1; i >= 0; i--) {
    const g = ghosts[i]; animate(g, now, dt, t, a);
    if (g.st === 'gone') { g.token++; g.inst?.dispose(); ghosts.splice(i, 1); }
  }
  renderer.render(scene, camera);
}

/* ---------- 시작 ---------- */
window.__cls = { S, members, addMember, removeMember, setAway, setMyPacket, enc };
try { const n = localStorage.getItem('medclass-name'); if (n) $('#name').value = n; const av = localStorage.getItem('medclass-avatar'); if (AVATARS.some((a) => a.id === av)) S.avatar = av; } catch (e) { /* 무시 */ }
const lobbyPick = (id) => { pickAvatar(id); avatarRow($('#lobbyAv'), lobbyPick); };
avatarRow($('#lobbyAv'), lobbyPick);
const preset = new URLSearchParams(location.search).get('room');
if (preset && /^[A-Za-z0-9]{6}$/.test(preset)) $('#code').value = preset.toUpperCase();
else if (savedHost()) setMode('host'); // 진행하던 수업이 있으면 바로 이어갈 수 있게
setBg(S.bg); resize(); tick();
</script>
