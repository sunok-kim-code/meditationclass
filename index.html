<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>아바타 테스트</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d1110;color:#f3f1ea;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden}
#stage{position:fixed;inset:0}
#bgImg,#bgVid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#bgVid{display:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl.mirror{transform:scaleX(-1)}
#pip{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;width:84px;height:112px;object-fit:cover;border-radius:12px;border:1px solid rgba(255,255,255,.35);transform:scaleX(-1);background:#000;display:none}
#status{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;max-width:62%;padding:7px 11px;border-radius:999px;background:rgba(13,17,16,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:12.5px;line-height:1.35}
#status.err{background:rgba(120,30,24,.85);border-radius:12px}
#panel{position:absolute;left:0;right:0;bottom:0;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(13,17,16,.88) 62%,rgba(13,17,16,0));transition:transform .25s}
#panel.hide{transform:translateY(100%)}
.row{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.lbl{font-size:11.5px;letter-spacing:.04em;color:#b9c2b8;margin:4px 2px 0}
.chip{flex:0 0 auto;min-height:44px;padding:0 15px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.07);color:inherit;font:inherit;font-size:14px}
.chip[aria-pressed="true"]{background:#e9e2cf;color:#17201b;border-color:#e9e2cf;font-weight:600}
.thumb{flex:0 0 auto;width:54px;height:54px;border-radius:12px;border:2px solid transparent;background-size:cover;background-position:center;padding:0}
.thumb[aria-pressed="true"]{border-color:#e9e2cf}
.thumb.up{border:1px dashed rgba(255,255,255,.5);background:rgba(255,255,255,.07);color:inherit;font-size:22px}
#toggle{position:absolute;right:12px;bottom:calc(100% + 8px);min-height:36px;padding:0 12px;border-radius:999px;border:0;background:rgba(13,17,16,.62);color:inherit;font:inherit;font-size:12.5px}
#panel.hide #toggle{bottom:calc(100% + 12px + env(safe-area-inset-bottom))}
#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:rgba(13,17,16,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#start h1{margin:0;font-size:22px;font-weight:600}
#start p{margin:0;max-width:30ch;font-size:14px;line-height:1.55;color:#d6dbd3}
#go{min-height:52px;padding:0 26px;border-radius:999px;border:0;background:#e9e2cf;color:#17201b;font:inherit;font-size:16px;font-weight:600}
#go:disabled{opacity:.6}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
<script type="importmap">
{"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
"@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js"
}}
</script>
</head>
<body>
<div id="stage">
  <img id="bgImg" alt="">
  <video id="bgVid" muted loop playsinline></video>
  <canvas id="gl" class="mirror"></canvas>
  <video id="pip" muted playsinline></video>
  <div id="status" role="status">아바타 불러오는 중…</div>

  <div id="panel">
    <button id="toggle" type="button">메뉴 숨기기</button>
    <div class="lbl">아바타</div>
    <div class="row" id="avatars"></div>
    <div class="lbl">배경</div>
    <div class="row" id="bgs"></div>
    <div class="row" style="padding-bottom:0">
      <button class="chip" id="mirrorBtn" type="button" aria-pressed="true">거울 보기</button>
      <button class="chip" id="pipBtn" type="button" aria-pressed="false">내 카메라 보기</button>
    </div>
    <input id="file" type="file" accept="image/*,video/*" hidden>
  </div>

  <div id="start">
    <h1>아바타 테스트</h1>
    <p>카메라가 표정과 고개 움직임을 읽어 아바타가 따라 움직입니다. 카메라 영상은 이 기기 밖으로 전송되지 않습니다.</p>
    <button id="go" type="button">카메라 켜고 시작</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const FACE_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const BASIS = 'https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/libs/basis/';

const AVATARS = [
  { id: 'a', label: '캐릭터 A', type: 'vrm', url: 'https://cdn.jsdelivr.net/gh/pixiv/three-vrm@v0.6.11/packages/three-vrm/examples/models/three-vrm-girl.vrm' },
  { id: 'b', label: '캐릭터 B', type: 'vrm', url: 'https://cdn.jsdelivr.net/gh/pixiv/three-vrm@dev/packages/three-vrm/examples/models/VRM1_Constraint_Twist_Sample.vrm' },
  { id: 'r', label: '사실적 3D', type: 'human', url: 'https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@main/avatars/brunette.glb' },
];
const BGS = [
  { id: 28, label: '숲 계곡' }, { id: 16, label: '호수' }, { id: 10, label: '숲과 바다' }, { id: 1043, label: '산과 강' },
];
const bgUrl = (id, w, h) => `https://picsum.photos/id/${id}/${w}/${h}`;

const $ = (s) => document.querySelector(s);
const statusEl = $('#status');
const say = (t, err) => { statusEl.textContent = t; statusEl.classList.toggle('err', !!err); };

/* ---------- 3D ---------- */
const canvas = $('#gl');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(24, 1, 0.05, 20);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.7;
const sun = new THREE.DirectionalLight(0xfff4e2, 1.6); sun.position.set(0.6, 1.2, 1.4); scene.add(sun);
scene.add(new THREE.HemisphereLight(0xdfeaf2, 0x39422f, 0.9));

const loader = new GLTFLoader();
loader.setKTX2Loader(new KTX2Loader().setTranscoderPath(BASIS).detectSupport(renderer));
loader.setMeshoptDecoder(MeshoptDecoder);
loader.register((p) => new VRMLoaderPlugin(p));

const clamp01 = (v) => Math.min(1, Math.max(0, v));
const cache = new Map();
let current = null;

function makeVrm(gltf) {
  const vrm = gltf.userData.vrm;
  if (!vrm) throw new Error('VRM 데이터를 찾지 못했습니다');
  const v0 = vrm.meta?.metaVersion === '0';
  VRMUtils.rotateVRM0(vrm);
  vrm.scene.traverse((o) => { o.frustumCulled = false; });
  const s = v0 ? -1 : 1;
  const bone = (n) => vrm.humanoid.getNormalizedBoneNode(n);
  const head = bone('head'), neck = bone('neck'), chest = bone('upperChest') || bone('chest') || bone('spine');
  const lArm = bone('leftUpperArm'), rArm = bone('rightUpperArm'), lFore = bone('leftLowerArm'), rFore = bone('rightLowerArm');
  if (lArm) lArm.rotation.z = -1.22 * s;
  if (rArm) rArm.rotation.z = 1.22 * s;
  if (lFore) lFore.rotation.z = -0.12 * s;
  if (rFore) rFore.rotation.z = 0.12 * s;
  vrm.update(0);
  vrm.scene.updateMatrixWorld(true);
  const hp = new THREE.Vector3();
  (head || vrm.scene).getWorldPosition(hp);
  const em = vrm.expressionManager;
  const setE = (n, v) => { if (em && em.getExpression(n)) em.setValue(n, clamp01(v)); };
  return {
    root: vrm.scene,
    center: new THREE.Vector3(0, hp.y - 0.05, 0), halfH: 0.3, halfW: 0.25,
    update(p, dt, t) {
      const e = p.euler;
      if (head) head.rotation.set(e.x * 0.6 * s, e.y * 0.6, e.z * 0.6 * s);
      if (neck) neck.rotation.set(e.x * 0.3 * s, e.y * 0.3, e.z * 0.3 * s);
      if (chest) chest.rotation.set(Math.sin(t * 1.1) * 0.012 * s, e.y * 0.15, e.z * 0.1 * s);
      const b = p.blend;
      setE('blinkLeft', (b.eyeBlinkLeft || 0) * 1.25);
      setE('blinkRight', (b.eyeBlinkRight || 0) * 1.25);
      setE('aa', (b.jawOpen || 0) * 1.4);
      setE('oh', (b.mouthFunnel || 0));
      setE('ou', (b.mouthPucker || 0) * 0.8);
      setE('happy', ((b.mouthSmileLeft || 0) + (b.mouthSmileRight || 0)) * 0.3);
      vrm.update(dt);
    },
  };
}

function makeHuman(gltf) {
  const model = gltf.scene;
  const morphs = [];
  model.traverse((o) => { o.frustumCulled = false; if (o.isMesh && o.morphTargetDictionary) morphs.push(o); });
  const get = (n) => model.getObjectByName(n);
  const parts = [['Head', 0.6], ['Neck', 0.3], ['Spine2', 0.12]].map(([n, w]) => ({ b: get(n), w })).filter((x) => x.b);
  for (const x of parts) x.rest = x.b.quaternion.clone();
  model.updateMatrixWorld(true);
  const hp = new THREE.Vector3();
  (get('Head') || model).getWorldPosition(hp);
  const q = new THREE.Quaternion(), e2 = new THREE.Euler();
  return {
    root: model, center: new THREE.Vector3(0, hp.y + 0.03, 0), halfH: 0.3, halfW: 0.25,
    update(p, dt, t) {
      const e = p.euler;
      for (const x of parts) {
        e2.set(e.x * x.w, e.y * x.w, e.z * x.w);
        x.b.quaternion.copy(x.rest).multiply(q.setFromEuler(e2));
      }
      const b = p.blend;
      for (const m of morphs) {
        const d = m.morphTargetDictionary, inf = m.morphTargetInfluences;
        for (const name in b) { const i = d[name]; if (i !== undefined) inf[i] = b[name]; }
      }
    },
  };
}

let pickToken = 0;
async function pickAvatar(def) {
  const token = ++pickToken;
  document.querySelectorAll('#avatars .chip').forEach((c) => c.setAttribute('aria-pressed', String(c.dataset.id === def.id)));
  try {
    if (!cache.has(def.id)) {
      const gltf = await loader.loadAsync(def.url, (ev) => {
        if (token !== pickToken) return;
        say(ev.total ? `${def.label} 불러오는 중… ${Math.round((ev.loaded / ev.total) * 100)}%` : `${def.label} 불러오는 중…`);
      });
      cache.set(def.id, def.type === 'vrm' ? makeVrm(gltf) : makeHuman(gltf));
    }
    if (token !== pickToken) return;
    if (current) scene.remove(current.root);
    current = cache.get(def.id);
    scene.add(current.root);
    frame();
    say(tracking ? trackMsg() : '아바타 준비 완료');
  } catch (err) {
    console.error(err);
    if (token === pickToken) say(`${def.label}을(를) 불러오지 못했습니다. 연결 상태를 확인하고 다시 눌러 주세요.`, true);
  }
}

function frame() {
  const w = canvas.clientWidth || innerWidth, h = canvas.clientHeight || innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  if (current) {
    const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    const dist = Math.max(current.halfH / t, current.halfW / (t * camera.aspect));
    const lift = current.halfH * (h > w ? 0.35 : 0.1);
    camera.position.set(current.center.x, current.center.y - lift, dist);
    camera.lookAt(current.center.x, current.center.y - lift, 0);
  }
  camera.updateProjectionMatrix();
}
addEventListener('resize', frame);

/* ---------- 얼굴 추적 ---------- */
const pip = $('#pip');
let landmarker = null, tracking = false, lastVT = -1, lastSeen = 0, fps = 0, fpsN = 0, fpsT = 0, delegate = '';
const target = { blend: {}, quat: new THREE.Quaternion() };
const pose = { blend: {}, quat: new THREE.Quaternion(), euler: new THREE.Euler() };
const m4 = new THREE.Matrix4(), tmpE = new THREE.Euler();
const trackMsg = () => (performance.now() - lastSeen < 900 ? `추적 중 · ${fps}fps` : '얼굴을 찾는 중… 화면 정면을 봐 주세요');

function setTarget(blend, euler) {
  target.blend = blend;
  target.quat.setFromEuler(euler);
  lastSeen = performance.now();
}
window.__avatarTest = { setTarget: (b, x, y, z, hold) => { setTarget(b || {}, new THREE.Euler(x || 0, y || 0, z || 0)); if (hold) lastSeen += 6e4; }, get: () => ({ x: pose.euler.x, y: pose.euler.y, z: pose.euler.z, seen: performance.now() - lastSeen < 900, fps, delegate }) };

function onResult(r) {
  if (!r.faceBlendshapes || !r.faceBlendshapes.length) return;
  const blend = {};
  for (const c of r.faceBlendshapes[0].categories) blend[c.categoryName] = c.score;
  const mat = r.facialTransformationMatrixes && r.facialTransformationMatrixes[0];
  if (mat) {
    m4.fromArray(mat.data);
    tmpE.setFromRotationMatrix(m4);
    const L = 0.7;
    tmpE.set(THREE.MathUtils.clamp(tmpE.x, -L, L), THREE.MathUtils.clamp(tmpE.y, -L, L), THREE.MathUtils.clamp(tmpE.z, -L, L));
  } else tmpE.set(0, 0, 0);
  setTarget(blend, tmpE);
  fpsN++;
}

async function startCamera() {
  const go = $('#go');
  go.disabled = true; go.textContent = '준비 중…';
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw Object.assign(new Error('nocam'), { name: 'NotSupportedError' });
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
    pip.srcObject = stream;
    await pip.play();
    say('얼굴 추적 모델 불러오는 중…');
    const { FaceLandmarker, FilesetResolver } = await import(`${MP}/vision_bundle.mjs`);
    const files = await FilesetResolver.forVisionTasks(`${MP}/wasm`);
    const opt = (d) => ({ baseOptions: { modelAssetPath: FACE_MODEL, delegate: d }, runningMode: 'VIDEO', numFaces: 1, outputFaceBlendshapes: true, outputFacialTransformationMatrixes: true });
    try { landmarker = await FaceLandmarker.createFromOptions(files, opt('GPU')); delegate = 'GPU'; }
    catch (e) { console.warn('GPU 실패, CPU로 전환', e); landmarker = await FaceLandmarker.createFromOptions(files, opt('CPU')); delegate = 'CPU'; }
    tracking = true;
    $('#start').remove();
    say(trackMsg());
  } catch (err) {
    console.error(err);
    go.disabled = false; go.textContent = '다시 시도';
    const msg = err.name === 'NotAllowedError' ? '카메라 권한이 거부됐습니다. 브라우저 설정에서 카메라를 허용한 뒤 다시 시도해 주세요.'
      : err.name === 'NotFoundError' ? '카메라를 찾지 못했습니다.'
      : err.name === 'NotSupportedError' ? '이 브라우저에서는 카메라를 쓸 수 없습니다. 사파리나 크롬으로 열어 주세요.'
      : '시작하지 못했습니다. 연결 상태를 확인하고 다시 시도해 주세요.';
    say(msg, true);
  }
}
$('#go').addEventListener('click', startCamera);

/* ---------- 루프 ---------- */
const clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.1), now = performance.now();
  if (tracking && landmarker && pip.readyState >= 2 && pip.currentTime !== lastVT) {
    lastVT = pip.currentTime;
    try { onResult(landmarker.detectForVideo(pip, now)); } catch (e) { console.warn(e); }
  }
  if (now - fpsT > 1000) { fps = Math.round((fpsN * 1000) / (now - fpsT)); fpsN = 0; fpsT = now; if (tracking && !statusEl.classList.contains('err')) say(trackMsg()); }
  const lost = now - lastSeen > 900;
  const a = 1 - Math.pow(0.0005, dt * 4);
  const keys = lost ? Object.keys(pose.blend) : Object.keys(target.blend);
  for (const k of keys) pose.blend[k] = THREE.MathUtils.lerp(pose.blend[k] || 0, lost ? 0 : target.blend[k], a);
  if (lost) target.quat.identity();
  pose.quat.slerp(target.quat, lost ? a * 0.3 : a);
  pose.euler.setFromQuaternion(pose.quat);
  if (current) current.update(pose, dt, clock.elapsedTime);
  renderer.render(scene, camera);
}

/* ---------- UI ---------- */
const avRow = $('#avatars');
for (const d of AVATARS) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'chip'; b.dataset.id = d.id; b.textContent = d.label; b.setAttribute('aria-pressed', 'false');
  b.addEventListener('click', () => pickAvatar(d));
  avRow.append(b);
}
const bgImg = $('#bgImg'), bgVid = $('#bgVid'), bgRow = $('#bgs');
function setBg(kind, src, btn) {
  bgRow.querySelectorAll('.thumb').forEach((t) => t.setAttribute('aria-pressed', String(t === btn)));
  if (kind === 'video') { bgVid.src = src; bgVid.style.display = 'block'; bgVid.play().catch(() => {}); }
  else { bgVid.pause(); bgVid.style.display = 'none'; bgImg.src = src; }
}
const big = () => (innerHeight > innerWidth ? [1080, 1920] : [1920, 1080]);
BGS.forEach((g, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'thumb'; b.setAttribute('aria-label', g.label); b.setAttribute('aria-pressed', 'false');
  b.style.backgroundImage = `url(${bgUrl(g.id, 120, 120)})`;
  b.addEventListener('click', () => setBg('image', bgUrl(g.id, ...big()), b));
  bgRow.append(b);
  if (i === 0) setBg('image', bgUrl(g.id, ...big()), b);
});
const up = document.createElement('button');
up.type = 'button'; up.className = 'thumb up'; up.textContent = '+'; up.setAttribute('aria-label', '내 사진이나 영상 올리기'); up.setAttribute('aria-pressed', 'false');
up.addEventListener('click', () => $('#file').click());
bgRow.append(up);
$('#file').addEventListener('change', (e) => {
  const f = e.target.files[0]; if (!f) return;
  setBg(f.type.startsWith('video') ? 'video' : 'image', URL.createObjectURL(f), up);
});
const press = (btn, on) => btn.setAttribute('aria-pressed', String(on));
$('#mirrorBtn').addEventListener('click', (e) => { const on = !canvas.classList.contains('mirror'); canvas.classList.toggle('mirror', on); press(e.currentTarget, on); });
$('#pipBtn').addEventListener('click', (e) => { const on = pip.style.display !== 'block'; pip.style.display = on ? 'block' : 'none'; press(e.currentTarget, on); });
$('#toggle').addEventListener('click', (e) => { const hide = !$('#panel').classList.contains('hide'); $('#panel').classList.toggle('hide', hide); e.currentTarget.textContent = hide ? '메뉴 보기' : '메뉴 숨기기'; });

frame();
tick();
pickAvatar(AVATARS[0]);
</script>
</body>
</html>
